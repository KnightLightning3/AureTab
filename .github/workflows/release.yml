name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or repair
        required: true
        default: v0.1
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate version
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(fs.readFileSync('manifest.json'));
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          assert.equal(`v${manifest.version}`, process.env.RELEASE_TAG);
          assert.equal(pkg.version, manifest.version);
          JS
      - name: Check syntax and run tests
        run: |
          find js -name '*.js' -exec node --check {} \;
          npm test
      - name: Package extension
        run: python3 scripts/package-extension.py --output "${RUNNER_TEMP}/AureTab-${RELEASE_TAG}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          title="AureTab · 简约标签页 ${RELEASE_TAG}"
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --verify-tag --title "$title" --notes-file "$notes"
          gh release edit "$RELEASE_TAG" --title "$title" --notes-file "$notes"
          gh release upload "$RELEASE_TAG" "${RUNNER_TEMP}/AureTab-${RELEASE_TAG}.zip" --clobber
