name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate version
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest = JSON.parse(fs.readFileSync('manifest.json'));
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          assert.equal(`v${manifest.version}`, process.env.GITHUB_REF_NAME);
          assert.equal(pkg.version, manifest.version);
          JS
      - name: Check syntax and run tests
        run: |
          find js -name '*.js' -exec node --check {} \;
          npm test
      - name: Package extension
        run: python3 scripts/package-extension.py --output "${RUNNER_TEMP}/AureTab-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${RUNNER_TEMP}/AureTab-${GITHUB_REF_NAME}.zip" --verify-tag --title "AureTab · 简约标签页 ${GITHUB_REF_NAME}" --notes-file docs/releases/v0.1.md
